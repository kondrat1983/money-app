<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;display:flex;align-items:center;justify-content:center;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
svg{display:block}
.num{font-variant-numeric:lining-nums tabular-nums}

#frame{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg);isolation:isolate}
@media (min-width:560px) and (min-height:640px){
  #frame{width:390px;height:844px;max-height:calc(100% - 24px);border:1px solid var(--line2);border-radius:30px;box-shadow:0 30px 80px var(--shadow)}
}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#grain,#vig{position:absolute;inset:0;pointer-events:none}
#grain{z-index:60;opacity:var(--grain);mix-blend-mode:overlay;background-size:160px 160px}
#vig{z-index:59;background:radial-gradient(ellipse at 50% 42%,transparent 52%,var(--vig) 100%)}

/* main */
#app{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:max(10px,env(safe-area-inset-top,0px))}
.top{display:flex;align-items:center;justify-content:space-between;height:40px}
.brand{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.32em;color:var(--muted);display:flex;align-items:center;gap:10px}
.brand i{width:7px;height:7px;background:var(--ember);transform:rotate(45deg);display:block}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.iconbtn svg{width:22px;height:22px}
.iconbtn[aria-pressed="true"]{color:var(--ember)}
.months{display:flex;align-items:center;justify-content:space-between;height:48px;margin-top:2px}
.months h1{margin:0;font-family:var(--display);font-weight:500;font-size:21px;letter-spacing:.14em;text-transform:uppercase;text-align:center}
.months h1 small{display:block;font-size:11px;letter-spacing:.3em;color:var(--muted);margin-top:2px}
#mcard{position:relative;margin-top:6px;padding:16px 8px 15px;background:var(--surface);border:1px solid var(--line2);display:grid;grid-template-columns:1fr 1.5fr 1fr;align-items:end;text-align:center}
#mcard::before{content:"";position:absolute;inset:3px;border:1px solid var(--line);pointer-events:none}
#mcard .lbl{font-family:var(--display);font-size:10px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
#mcard .v{font-size:18px;font-weight:500;white-space:nowrap}
#mcard .inc .v{color:var(--inc)}
#mcard .exp .v{color:var(--exp)}
#mcard .bal .v{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.02em;display:inline-block}
#mcard .bal .v.sm{font-size:23px}
#mcard .bal.neg .v{color:var(--neg)}
.shake{animation:shake .32s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{20%{transform:translateX(-4px)}40%{transform:translateX(3.5px)}60%{transform:translateX(-2.5px)}80%{transform:translateX(1.5px)}}

#scroller::-webkit-scrollbar{display:none}
#list.sl-l{animation:slL .24s ease-out}
#list.sl-r{animation:slR .24s ease-out}
@keyframes slL{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes slR{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.day{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 4px;padding-bottom:5px;border-bottom:1px solid var(--line);font-family:var(--display);font-size:11px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
.day:first-child{margin-top:2px}
.day .dt{font-family:var(--body);letter-spacing:.02em;font-size:13px;text-transform:none}
.row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.row .mid{flex:1;min-width:0}
.row .nm{font-size:17px;line-height:1.15;font-weight:500}
.row .memo{font-size:13.5px;color:var(--muted);line-height:1.2;margin-top:2px;overflow-wrap:anywhere}
.row .amt{font-size:18px;font-weight:500;white-space:nowrap;text-align:right}
.row .amt.e{color:var(--exp)} .row .amt.i{color:var(--inc)}
.row.new{animation:rowIn .36s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes rowIn{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.row.new .ic{box-shadow:0 0 0 1px var(--ember)}
.ic{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--line2);background:var(--surface);display:grid;place-items:center;color:var(--text)}
.ic svg{width:21px;height:21px}
.ic.i{color:var(--inc)}
.empty{text-align:center;color:var(--faint);padding:60px 20px;font-family:var(--display);letter-spacing:.14em;font-size:13px;line-height:2}
.empty b{display:block;color:var(--ember);font-size:12px}

#fab{position:absolute;z-index:5;left:50%;bottom:max(26px,calc(env(safe-area-inset-bottom,0px) + 14px));width:68px;height:68px;margin-left:-34px;border-radius:50%;background:var(--surface2);border:1px solid var(--ember);color:var(--ember);display:grid;place-items:center;box-shadow:0 0 0 4px var(--bg),0 0 0 5px var(--line2),0 8px 24px var(--shadow);transition:transform .16s cubic-bezier(.3,1.5,.5,1)}
#fab:active{transform:scale(.92)}
#fab svg{width:30px;height:30px}

/* entry */
#entry{position:absolute;inset:0;z-index:20;background:var(--bg);visibility:hidden;display:flex;flex-direction:column;padding-top:max(10px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
#entry .in{display:flex;flex-direction:column;flex:1;min-height:0}
.e-top{display:flex;align-items:center;justify-content:space-between;height:48px}
.seg{display:flex;border:1px solid var(--line2);border-radius:999px;padding:3px;background:var(--surface)}
.seg button{height:34px;padding:0 20px;border-radius:999px;font-family:var(--display);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--exp-deep);color:var(--text)}
#entry.inc .seg button[aria-pressed="true"]{background:color-mix(in srgb,var(--inc) 28%,var(--bg))}
.e-amt{text-align:center;margin-top:14px;min-height:96px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.e-amt .cur{font-family:var(--display);font-size:26px;color:var(--muted);align-self:flex-start;margin-top:14px}
#amt{font-family:var(--display);font-weight:700;font-size:64px;line-height:1;letter-spacing:.01em;color:var(--exp);white-space:nowrap;font-variant-numeric:lining-nums tabular-nums}
#amt.z{color:var(--faint)}
#entry.inc #amt:not(.z){color:var(--inc)}
#amt.l2{font-size:52px}#amt.l3{font-size:42px}#amt.l4{font-size:34px}
#amt span{display:inline-block}
#amt span.pop{animation:pop .2s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.7) translateY(8px);opacity:.4}100%{transform:none;opacity:1}}
.chips{display:flex;gap:10px;align-items:center;margin-top:6px}
.chip{height:40px;padding:0 16px;border:1px solid var(--line2);border-radius:999px;background:var(--surface);font-size:15px;color:var(--text);white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
.chip svg{width:16px;height:16px;color:var(--muted)}
#memo{flex:1;min-width:0;height:40px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--text);font:inherit;font-size:15px;padding:0 16px}
#memo::placeholder{color:var(--faint)}
.e-body{flex:1;min-height:0;display:flex;flex-direction:column;margin-top:14px}
#pad{display:flex;flex-direction:column;flex:1;min-height:0;justify-content:flex-end;gap:12px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{height:58px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-family:var(--display);font-weight:500;font-size:25px;display:grid;place-items:center;transition:transform .12s cubic-bezier(.3,1.5,.5,1),background .12s;font-variant-numeric:lining-nums}
.key:active{transform:scale(.93);background:var(--surface2)}
.key svg{width:26px;height:26px;color:var(--muted)}
.choose{height:56px;border-radius:14px;background:var(--exp-deep);border:1px solid var(--exp);color:var(--text);font-family:var(--display);font-size:14px;letter-spacing:.2em;text-transform:uppercase;transition:opacity .15s,transform .12s}
#entry.inc .choose{background:color-mix(in srgb,var(--inc) 26%,var(--bg));border-color:var(--inc)}
.choose:active{transform:scale(.98)}
.choose:disabled{opacity:.3;cursor:default}
#cats{display:none;flex:1;min-height:0;flex-direction:column}
#entry.st-cats #pad{display:none}
#entry.st-cats #cats{display:flex;animation:catsIn .26s cubic-bezier(.2,.9,.3,1)}
@keyframes catsIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.ask{margin:2px 0 10px;text-align:center;font-family:var(--display);font-size:12px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase}
#grid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:10px 8px;align-content:start;padding-bottom:6px;scrollbar-width:none}
#grid::-webkit-scrollbar{display:none}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0;border-radius:12px;min-width:0}
.cat .ic{width:54px;height:54px}
.cat .ic svg{width:26px;height:26px}
.cat .nm{font-size:12.5px;line-height:1.12;text-align:center;overflow-wrap:anywhere;hyphens:auto;color:var(--text);min-height:28px}
.cat:active .ic{transform:scale(.92)}
.cat .ic{transition:transform .12s cubic-bezier(.3,1.5,.5,1),border-color .15s}
.cat:hover .ic{border-color:var(--ember)}
.cat.rec .ic{border-color:var(--ember)}

/* signature */
#sig{position:absolute;z-index:40;left:0;right:0;top:44%;height:168px;margin-top:-84px;display:none;align-items:center;justify-content:center;pointer-events:none;text-align:center;
  background:var(--band);-webkit-mask-image:linear-gradient(to bottom,transparent,#000 24%,#000 76%,transparent);mask-image:linear-gradient(to bottom,transparent,#000 24%,#000 76%,transparent)}

#sig.big{height:210px;margin-top:-105px;animation-duration:1.7s}
#sig .txt{font-family:var(--display);font-weight:700;color:var(--card-red);text-transform:uppercase;white-space:nowrap;line-height:1.25;padding:0 6px;animation:txt 1.1s cubic-bezier(.2,.6,.3,1) both}
#sig.big .txt{animation-duration:1.7s;text-shadow:0 0 22px color-mix(in srgb,var(--card-red) 55%,transparent)}

#sig.earn.big .txt{text-shadow:0 0 22px color-mix(in srgb,var(--inc) 45%,transparent)}
#sig .txt span{display:block}
#sig.rm,#sig.rm .txt{animation:none}
#sig.rm .txt{letter-spacing:.14em}
@keyframes band{0%{opacity:0}12%{opacity:1}78%{opacity:1}100%{opacity:0}}
@keyframes txt{0%{opacity:0;letter-spacing:.03em}16%{opacity:1}62%{opacity:1}100%{opacity:0;letter-spacing:.2em}}
#flash{position:absolute;inset:0;z-index:38;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 50% 45%,transparent 25%,color-mix(in srgb,var(--card-red) 70%,#000) 130%)}
#flash.on{animation:flash 1.2s ease-out both}
@keyframes flash{0%{opacity:0}15%{opacity:.75}100%{opacity:0}}
#fx{position:absolute;inset:0;z-index:45;pointer-events:none;width:100%;height:100%}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  #flash{display:none}
}

 Clothing:"M8.500 3L3 6.500l2 4 2.500-1V21h9V9.500l2.500 1 2-4L15.500 3c-.5 1.500-1.800 2.300-3.500 2.300S9 4.500 8.500 3z",

var CATS={
 e:["Food","Pizza","Snacks","Fruits","Wine","Transportation","Utilities","Internet","Telephone","Subscriptions","Bank fees","Home","Electronics","Clothing","Health","Gift","Family","Donations","Games","Entertainment","ATM","Cigarettes","Filter","Books","Education","Football","Arcade","Others"],

/* ---------- data ---------- */
var now=new Date(), Y=now.getFullYear(), M=now.getMonth(), D=now.getDate();
function ds(y,m,d){return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0")}

var uid=1;
function mk(t,c,a,memo,date){return{id:uid++,t:t,c:c,a:a,memo:memo||"",d:date}}
var txs=[
 mk("i","Salary",52000,"",dayAgo(3)),
 mk("i","Others",207733,"Freelance project",dayAgo(3)),
 mk("e","Games",449,"Indie game",dayAgo(4)),

];
var recent={e:[],i:[]};
txs.slice().sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:b.id-a.id}).forEach(function(t){if(recent[t.t].indexOf(t.c)<0)recent[t.t].push(t.c)});
var view={y:Y,m:M};

function fmt(n){return String(Math.abs(Math.round(n))).replace(/\B(?=(\d{3})+(?!\d))/g,NB)}
function money(n){return (n<0?"-":"")+"₴"+fmt(n)}

/* ---------- main render ---------- */
var shown={inc:0,exp:0,bal:0}, firstTotals=true;
function monthTxs(){var p=view.y+"-"+String(view.m+1).padStart(2,"0");return txs.filter(function(t){return t.d.indexOf(p)===0})}
function dayLabel(d){
  var a=d.split("-"),dt=new Date(+a[0],+a[1]-1,+a[2]);
  var diff=Math.round((new Date(Y,M,D)-dt)/864e5);
  if(diff===0)return "Today";if(diff===1)return "Yesterday";
  return dt.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})
}
function render(newId){
  $("mname").innerHTML=new Date(view.y,view.m,1).toLocaleDateString("en-GB",{month:"long"})+"<small>"+view.y+"</small>";
  var list=monthTxs().sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:b.id-a.id});
  if(!list.length){$("list").innerHTML='<div class="empty"><b>&#9670;</b>The ledger is silent.<br>Nothing spent, nothing earned.</div>'}
  else{
    var h="",cur="",sum=0,i,gs=[];
    list.forEach(function(t){
      if(t.d!==cur){gs.push({d:t.d,rows:[]});cur=t.d}
      gs[gs.length-1].rows.push(t);
    });
    gs.forEach(function(g){
      var s=0;g.rows.forEach(function(t){s+=t.t==="e"?-t.a:t.a});
      h+='<div class="day"><span>'+dayLabel(g.d)+'</span><span class="dt num">'+(s<0?"-":"+")+fmt(s)+'</span></div>';
      g.rows.forEach(function(t){
        h+='<div class="row'+(t.id===newId?" new":"")+'"><span class="ic '+t.t+'">'+ic(t.c)+'</span><div class="mid"><div class="nm">'+t.c+'</div>'+(t.memo?'<div class="memo">'+esc(t.memo)+'</div>':"")+'</div><div class="amt num '+t.t+'">'+(t.t==="e"?"-":"+")+fmt(t.a)+'</div></div>';
      });
    });
    $("list").innerHTML=h;
  }
  var inc=0,exp=0;list.forEach(function(t){if(t.t==="i")inc+=t.a;else exp+=t.a});
  roll("inc",inc);roll("exp",exp);roll("bal",inc-exp);
  firstTotals=false;
}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var rollTok={};
function paint(k,v){
  var el=k==="inc"?$("vInc"):k==="exp"?$("vExp"):$("vBal");
  el.textContent=money(v);
  if(k==="bal"){el.classList.toggle("sm",el.textContent.length>9);$("balBox").classList.toggle("neg",v<0)}
}
function roll(k,to){
  var from=shown[k];shown[k]=to;var tok=rollTok[k]=(rollTok[k]||0)+1;
  if(RM.matches||firstTotals||from===to){paint(k,to);return}
  var t0=performance.now(),d=560;
  (function step(t){
    if(rollTok[k]!==tok)return;
    var p=Math.min(1,(t-t0)/d),e=1-Math.pow(1-p,3);
    paint(k,Math.round(from+(to-from)*e));
    if(p<1)requestAnimationFrame(step)
  })(t0);
}
function shakeBal(){var el=$("vBal");el.classList.remove("shake");void el.offsetWidth;el.classList.add("shake")}

/* months */
function go(dir){
  view.m+=dir;if(view.m<0){view.m=11;view.y--}if(view.m>11){view.m=0;view.y++}
  render();
  var l=$("list");l.classList.remove("sl-l","sl-r");void l.offsetWidth;
  if(!RM.matches)l.classList.add(dir>0?"sl-l":"sl-r");
  $("scroller").scrollTop=0;
}
$("prev").onclick=function(){go(-1)};
$("next").onclick=function(){go(1)};
(function(){
  var sx=0,sy=0,on=false,sc=$("scroller");
  sc.addEventListener("pointerdown",function(e){sx=e.clientX;sy=e.clientY;on=true});
  sc.addEventListener("pointerup",function(e){
    if(!on)return;on=false;var dx=e.clientX-sx,dy=e.clientY-sy;
    if(Math.abs(dx)>70&&Math.abs(dy)<45)go(dx<0?1:-1)
  });
  sc.addEventListener("pointercancel",function(){on=false});
})();

/* ---------- sound ---------- */
var soundOn=false,actx=null;
var ICON_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.500h3.500L12 5.500v13l-4.500-4H4z"/><path d="M16 9.500l5 5M21 9.500l-5 5"/></svg>';
var ICON_ON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.500h3.500L12 5.500v13l-4.500-4H4z"/><path d="M15.500 9a4 4 0 0 1 0 6M18 6.500a7.500 7.500 0 0 1 0 11"/></svg>';
$("snd").innerHTML=ICON_OFF;
$("snd").onclick=function(){
  soundOn=!soundOn;
  this.setAttribute("aria-pressed",soundOn);this.setAttribute("aria-label",soundOn?"Sound on":"Sound off");
  this.innerHTML=soundOn?ICON_ON:ICON_OFF;
  if(soundOn){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume();play("e")}catch(e){soundOn=false}}
};
function tone(type,f0,f1,t,dur,vol,delay){
  var o=actx.createOscillator(),g=actx.createGain(),s=actx.currentTime+(delay||0);
  o.type=type;o.frequency.setValueAtTime(f0,s);if(f1)o.frequency.exponentialRampToValueAtTime(f1,s+dur);
  g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(vol,s+0.03);g.gain.exponentialRampToValueAtTime(0.0001,s+dur);
  o.connect(g);g.connect(actx.destination);o.start(s);o.stop(s+dur+0.05)
}
function play(t){
  if(!soundOn||!actx)return;
  try{
    if(t==="e"){tone("sine",64,40,0,1.0,0.35);tone("triangle",128,80,0,0.7,0.06)}
    else{tone("triangle",988,988,0,0.28,0.12);tone("triangle",1319,1319,0,0.45,0.12,0.09)}
  }catch(e){}
}

/* ---------- ember particles ---------- */
var fx=$("fx"),fctx=fx.getContext("2d"),parts=[],fxRun=false;
function embers(type,n){
  if(RM.matches)return;
  var w=fx.clientWidth,h=fx.clientHeight,dpr=Math.min(2,window.devicePixelRatio||1);
  if(fx.width!==w*dpr){fx.width=w*dpr;fx.height=h*dpr}
  fctx.setTransform(dpr,0,0,dpr,0,0);
  var cy=h*0.44,col=type==="i"?["#c0a45a","#e0c878"]:["#d98a32","#e8a64a","#b8442a"];
  for(var i=0;i<n;i++)parts.push({x:w*(0.12+Math.random()*0.76),y:cy+(Math.random()-.3)*50,vx:(Math.random()-.5)*24,vy:-(26+Math.random()*70),r:.8+Math.random()*1.7,life:0,max:.9+Math.random()*1.0,c:col[i%col.length],ph:Math.random()*6});
  if(!fxRun){fxRun=true;var last=performance.now();requestAnimationFrame(function loop(t){
    var dt=Math.min(.05,(t-last)/1000);last=t;
    fctx.clearRect(0,0,w,h);
    parts=parts.filter(function(p){return p.life<p.max});
    parts.forEach(function(p){
      p.life+=dt;p.x+=(p.vx+Math.sin(p.life*4+p.ph)*10)*dt;p.y+=p.vy*dt;
      var a=Math.max(0,1-p.life/p.max);
      fctx.globalAlpha=a*.9;fctx.fillStyle=p.c;fctx.beginPath();fctx.arc(p.x,p.y,p.r,0,6.3);fctx.fill();
    });
    fctx.globalAlpha=1;
    if(parts.length)requestAnimationFrame(loop);else{fxRun=false;fctx.clearRect(0,0,w,h)}
  })}
}

/* ---------- signature moment ---------- */
var sig=$("sig"),sigTimer=null,pend=[];
function showSig(t,amt){
  var big=t==="e"&&amt>=5000||t==="i"&&amt>=100000;
  var label=t==="e"?"YOU SPENT":"YOU EARNED",val="₴"+fmt(amt);
  var W=Math.min($("frame").clientWidth,420)-44;
  var one=label+" "+val,fs=Math.min(40,W/(one.length*0.98)),two=false;
  if(big)fs*=1.0;
  if(fs<27){two=true;fs=Math.min(big?44:38,W/(Math.max(label.length,val.length)*0.98))}
  var tx=$("sigTxt");
  tx.style.fontSize=fs+"px";
  tx.innerHTML=two?"<span>"+label+"</span><span>"+val+"</span>":one;
  sig.className="";void sig.offsetWidth;
  sig.className="on"+(t==="i"?" earn":"")+(big?" big":"")+(RM.matches?" rm":"");
  var fl=$("flash");fl.className="";void fl.offsetWidth;if(big&&t==="e")fl.className="on";
  clearTimeout(sigTimer);
  sigTimer=setTimeout(hideSig,RM.matches?600:(big?1700:1100));
  embers(t,big?46:26);
  play(t);
}
function hideSig(){clearTimeout(sigTimer);sig.className="";$("flash").className="";flush()}
window.addEventListener("pointerdown",function(){if(sig.classList.contains("on"))hideSig()},true);
window.addEventListener("keydown",function(){if(sig.classList.contains("on"))hideSig()},true);

function flush(){
  if(!pend.length)return;
  var items=pend;pend=[];
  items.forEach(function(it){txs.push(it)});
  var last=items[items.length-1],p=last.d.slice(0,7);
  view.y=+p.slice(0,4);view.m=+p.slice(5,7)-1;
  render(last.id);
  var inc=0,exp=0;monthTxs().forEach(function(t){if(t.t==="i")inc+=t.a;else exp+=t.a});
  if(inc-exp<0)setTimeout(shakeBal,RM.matches?0:260);
  var r=document.querySelector(".row.new");if(r&&r.scrollIntoView)$("scroller").scrollTop=0;
}

/* ---------- entry ---------- */
var E={t:"e",digits:"",off:0,stage:"keys",open:false};
var entry=$("entry"),fab=$("fab");
function buildKeys(){
  var h="";["1","2","3","4","5","6","7","8","9","00","0","bk"].forEach(function(k){
    if(k==="bk")h+='<button class="key" data-k="bk" aria-label="Backspace"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9L3 12l6 7h12z"/><path d="M13 9.500l5 5M18 9.500l-5 5"/></svg></button>';
    else h+='<button class="key num" data-k="'+k+'">'+k+'</button>';
  });
  $("keys").innerHTML=h;
}
function setAmt(pop){
  var d=E.digits,s=d?fmt(+d):"0",el=$("amt");
  el.className=(d?"":"z ")+(s.length>11?"l4":s.length>9?"l3":s.length>7?"l2":"");
  var h="";
  for(var i=0;i<s.length;i++)h+="<span"+(pop&&i>=s.length-pop?' class="pop"':"")+">"+s[i]+"</span>";
  el.innerHTML=h;
  $("choose").disabled=!d;
  el.setAttribute("aria-label",d?fmt(+d)+" hryvnia":"zero");
}
function press(k){
  if(k==="bk"){E.digits=E.digits.slice(0,-1);setAmt(0);return}
  if(!E.digits&&(k==="0"||k==="00"))return;
  var n=E.digits+k;if(n.length>9)return;
  E.digits=n;setAmt(k.length);
}
$("keys").addEventListener("click",function(e){var b=e.target.closest(".key");if(b)press(b.dataset.k)});
function setType(t){
  E.t=t;entry.classList.toggle("inc",t==="i");
  $("tExp").setAttribute("aria-pressed",t==="e");$("tInc").setAttribute("aria-pressed",t==="i");
  $("ask").textContent=t==="e"?"Where did it go?":"Where did it come from?";
  buildGrid();
}
$("tExp").onclick=function(){setType("e")};
$("tInc").onclick=function(){setType("i")};
function dateStr(){return dayAgo(E.off)}
function setDate(){
  $("dateTxt").textContent=E.off===0?"Today":E.off===1?"Yesterday":dayLabel(dateStr());
}
$("dateChip").onclick=function(){E.off=(E.off+1)%5;setDate()};
function buildGrid(){
  var all=CATS[E.t],rec=recent[E.t].filter(function(c){return all.indexOf(c)>=0}),order=rec.concat(all.filter(function(c){return rec.indexOf(c)<0}));
  $("grid").innerHTML=order.map(function(c,i){return '<button class="cat'+(i<4&&rec.length>i?" rec":"")+'" data-c="'+c+'"><span class="ic '+E.t+'">'+ic(c)+'</span><span class="nm">'+c+'</span></button>'}).join("");
}
$("grid").addEventListener("click",function(e){var b=e.target.closest(".cat");if(b)save(b.dataset.c)});
function stage(s){E.stage=s;entry.classList.toggle("st-cats",s==="cats");if(s==="cats")$("grid").scrollTop=0}
$("choose").onclick=function(){if(E.digits){if(document.activeElement===$("memo"))$("memo").blur();stage("cats")}};
$("amtBox").onclick=function(){stage("keys")};

function geom(){
  var fr=$("frame").getBoundingClientRect(),fb=fab.getBoundingClientRect();
  return{x:fb.left+fb.width/2-fr.left,y:fb.top+fb.height/2-fr.top,R:Math.hypot(fr.width,fr.height)}
}
var anim=null;
function openEntry(){
  if(E.open)return;
  E.open=true;E.digits="";E.off=0;E.stage="keys";$("memo").value="";
  setType(E.t);setAmt(0);setDate();stage("keys");
  var g=geom();entry.style.visibility="visible";entry.removeAttribute("aria-hidden");
  if(anim)anim.cancel();
  if(RM.matches){entry.style.clipPath="";return}
  anim=entry.animate([{clipPath:"circle(34px at "+g.x+"px "+g.y+"px)",opacity:.6},{clipPath:"circle("+g.R+"px at "+g.x+"px "+g.y+"px)",opacity:1}],{duration:340,easing:"cubic-bezier(.2,.85,.25,1)"});
  var inn=entry.querySelector(".in");
  inn.animate([{opacity:0,transform:"translateY(14px)"},{opacity:1,transform:"none"}],{duration:260,delay:90,easing:"ease-out",fill:"backwards"});
}
function closeEntry(){
  if(!E.open)return;E.open=false;
  entry.setAttribute("aria-hidden","true");
  if(document.activeElement===$("memo"))$("memo").blur();
  if(anim)anim.cancel();
  if(RM.matches){entry.style.visibility="hidden";return}
  var g=geom();
  anim=entry.animate([{clipPath:"circle("+g.R+"px at "+g.x+"px "+g.y+"px)",opacity:1},{clipPath:"circle(34px at "+g.x+"px "+g.y+"px)",opacity:.4}],{duration:240,easing:"cubic-bezier(.5,0,.8,.4)",fill:"forwards"});
  var a=anim;a.onfinish=function(){if(!E.open){entry.style.visibility="hidden";a.cancel()}};
}
function save(cat){
  if(!E.digits)return;
  flush();
  var amt=+E.digits,t=E.t;
  var tx=mk(t,cat,amt,$("memo").value.trim(),dateStr());
  pend.push(tx);
  var r=recent[t];var i=r.indexOf(cat);if(i>=0)r.splice(i,1);r.unshift(cat);
  closeEntry();
  showSig(t,amt);
}
fab.onclick=openEntry;
$("xBtn").onclick=closeEntry;
window.addEventListener("keydown",function(e){
  if(!E.open)return;
  if(e.key==="Escape"){closeEntry();return}
  if(document.activeElement===$("memo")||e.ctrlKey||e.metaKey||e.altKey)return;
  if(E.stage==="keys"){
    if(/^[0-9]$/.test(e.key)){press(e.key);e.preventDefault()}
    else if(e.key==="Backspace"){press("bk");e.preventDefault()}
    else if(e.key==="Enter"&&E.digits&&document.activeElement.tagName!=="BUTTON"){stage("cats")}
  }
});

(function(){
  try{
    var c=document.createElement("canvas");c.width=c.height=128;var x=c.getContext("2d"),im=x.createImageData(128,128);
    for(var i=0;i<im.data.length;i+=4){var v=Math.random()*255|0;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}
    x.putImageData(im,0,0);$("grain").style.backgroundImage="url("+c.toDataURL()+")";
  }catch(e){}
})();

buildKeys();render();
})();
