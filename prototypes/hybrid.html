<title>YOU SPENT · Hybrid</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=Cinzel:wght@500;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --bg:#120e0c; --bg2:#191411; --panel:#1c1713; --circle:#27201a;
  --line:rgba(231,220,198,.12); --line2:rgba(231,220,198,.24);
  --ink:#e7dcc6; --ink2:#aa9d86; --ink3:#766b5a;
  --exp:#b8443c; --inc:#6f95c9; --amber:#d0a03a; --on-amber:#1a1208;
  --band:8,4,3; --frame-line:rgba(231,220,198,.14);
  --display:"Cinzel","Cormorant SC",Georgia,"Times New Roman",serif;
  --pixel:"Silkscreen",ui-monospace,"SF Mono",Menlo,monospace;
  --text:"Alegreya Sans","Avenir Next",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme: light;
    --bg:#ece4d2; --bg2:#e4dac4; --panel:#f3ecdc; --circle:#ddd1b8;
    --line:rgba(40,30,20,.14); --line2:rgba(40,30,20,.3);
    --ink:#241c15; --ink2:#5b4f40; --ink3:#8a7c68;
    --exp:#9a2f29; --inc:#2f5a95; --amber:#9a6d10; --on-amber:#f6ecd4;
    --band:20,10,8; --frame-line:rgba(40,30,20,.2);
  }
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#ece4d2; --bg2:#e4dac4; --panel:#f3ecdc; --circle:#ddd1b8;
  --line:rgba(40,30,20,.14); --line2:rgba(40,30,20,.3);
  --ink:#241c15; --ink2:#5b4f40; --ink3:#8a7c68;
  --exp:#9a2f29; --inc:#2f5a95; --amber:#9a6d10; --on-amber:#f6ecd4;
  --band:20,10,8; --frame-line:rgba(40,30,20,.2);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:16px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:6px}
svg.px,img.px{image-rendering:pixelated;display:block}

/* frame */
.frame{position:relative;width:100%;height:100%;background:var(--bg);overflow:hidden;
  display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
@media (min-width:560px){
  .frame{width:390px;height:844px;max-height:calc(100% - 24px);border:1px solid var(--frame-line);border-radius:30px;
    box-shadow:0 30px 80px rgba(0,0,0,.45)}
}

/* top bar */
.top{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;padding-top:10px;height:62px;flex:none}
.ibtn{width:40px;height:40px;display:grid;place-items:center;color:var(--ink2);border-radius:10px}
.ibtn:active{color:var(--ink)}
.ibtn svg{width:22px;height:22px}
.monthnav{display:flex;align-items:center;justify-content:center;gap:6px}
.mname{text-align:center;min-width:150px;line-height:1}
.mname b{display:block;font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.16em;margin-right:-.16em}
.mname span{display:block;font-family:var(--pixel);font-size:9px;letter-spacing:.3em;margin-top:6px;color:var(--ink3);margin-right:-.3em}
.arrow{width:36px;height:40px;display:grid;place-items:center;color:var(--ink2)}
.arrow svg{width:12px;height:16px}

/* month card */
.card{flex:none;margin-top:6px;background:var(--panel);border-top:3px double var(--line2);border-bottom:1px solid var(--line);
  display:grid;grid-template-columns:1fr 1fr 1.25fr;position:relative}
.card::before,.card::after{content:"";position:absolute;top:-6px;width:9px;height:9px;background:var(--bg);border:1px solid var(--line2);transform:rotate(45deg)}
.card::before{left:calc(50% - 5px)}
.card::after{display:none}
.cell{padding:18px 6px 14px 12px;min-width:0}
.cell+.cell{border-left:1px solid var(--line)}
.cell label{display:block;font-family:var(--display);font-weight:500;font-size:10px;letter-spacing:.2em;color:var(--ink3);margin-bottom:9px}
.cell output{display:block;font-family:var(--pixel);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.cell output.s{font-size:12px}
.cell.inc output{color:var(--inc)}
.cell.exp output{color:var(--exp)}
.cell.bal output{color:var(--ink);font-size:16px}
.cell.bal output.s{font-size:13px}
.cell.bal output.neg{color:var(--exp)}
.cell.bal output.shake{animation:shake .32s cubic-bezier(.3,.7,.4,1)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}45%{transform:translateX(4px)}70%{transform:translateX(-2px)}}

/* list */
.listwrap{flex:1;min-height:0;position:relative;overflow-y:auto;overflow-x:hidden;margin:0 calc(-1 * max(16px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(130px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  overscroll-behavior:contain;scrollbar-width:none}
.listwrap::-webkit-scrollbar{display:none}
.day{display:flex;justify-content:space-between;align-items:baseline;padding:22px 0 8px;font-family:var(--display);font-size:11px;font-weight:500;letter-spacing:.18em;color:var(--ink3)}
.day em{font-style:normal;color:var(--amber)}
.day i{font-style:normal;font-family:var(--pixel);font-size:10px;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:12px;min-height:58px;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.ic{flex:none;width:44px;height:44px;border-radius:50%;background:var(--circle);border:1px solid var(--line2);display:grid;place-items:center}
.ic svg{width:28px;height:28px}
.row .nm{flex:1;min-width:0;line-height:1.2}
.row .nm b{display:block;font-weight:500;font-size:16px;overflow-wrap:anywhere}
.row .nm small{display:block;font-size:13px;color:var(--ink3);margin-top:1px;overflow-wrap:anywhere}
.row .am{font-family:var(--pixel);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.row.exp .am{color:var(--exp)} .row.inc .am{color:var(--inc)}
.row.enter{animation:rowin .34s cubic-bezier(.2,.9,.25,1) both;animation-delay:.62s}
@keyframes rowin{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
.empty{padding:60px 20px;text-align:center;color:var(--ink3);font-family:var(--display);font-size:13px;letter-spacing:.14em;line-height:1.8}

/* fab */
.fabzone{position:absolute;left:0;right:0;bottom:0;height:150px;pointer-events:none;
  background:linear-gradient(to top,var(--bg) 38%,transparent)}
.fab{position:absolute;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));width:70px;height:70px;margin-left:-35px;border-radius:50%;
  background:var(--bg2);border:2px solid var(--amber);color:var(--amber);display:grid;place-items:center;
  box-shadow:0 0 0 5px var(--bg),0 0 0 6px var(--line2),0 10px 24px rgba(0,0,0,.45);transition:transform .16s cubic-bezier(.3,1.6,.5,1)}
.fab:active{transform:scale(.92)}
.fab svg{width:30px;height:30px}

/* entry */
.entry{position:absolute;inset:0;background:var(--bg);z-index:5;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px));
  visibility:hidden;clip-path:circle(0px at var(--fx,50%) var(--fy,90%));
  transition:clip-path .3s cubic-bezier(.5,0,.7,.4),visibility 0s linear .3s}
.entry.open{visibility:visible;clip-path:circle(1400px at var(--fx,50%) var(--fy,90%));
  transition:clip-path .38s cubic-bezier(.2,.8,.25,1),visibility 0s}
.ehead{display:flex;align-items:center;justify-content:space-between;gap:8px;height:62px;padding-top:10px;flex:none}
.seg{display:flex;border:1px solid var(--line2);border-radius:999px;padding:3px}
.seg button{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.16em;padding:9px 14px 8px 17px;border-radius:999px;color:var(--ink3);min-height:34px}
.seg button[aria-pressed="true"]{color:var(--bg)}
.seg button[data-t="exp"][aria-pressed="true"]{background:var(--exp);color:#f4e8d4}
.seg button[data-t="inc"][aria-pressed="true"]{background:var(--inc);color:#0f1520}
.chip{font-size:14px;font-weight:500;color:var(--ink2);border:1px solid var(--line2);border-radius:999px;padding:7px 13px;min-height:34px;white-space:nowrap}
.amount{flex:none;display:flex;align-items:baseline;justify-content:center;gap:8px;height:74px;padding-top:6px;white-space:nowrap}
.amount .cur{font-family:var(--text);font-weight:500;font-size:26px;color:var(--ink3)}
.amount .val{font-family:var(--pixel);font-weight:700;font-variant-numeric:tabular-nums;font-size:50px;line-height:1;color:var(--exp)}
.entry[data-type="inc"] .amount .val{color:var(--inc)}
.amount .val.zero{opacity:.35}
.amount .val .pop{display:inline-block;animation:pop .26s cubic-bezier(.3,1.7,.5,1)}
.amount.nope{animation:shake .3s}
@keyframes pop{0%{transform:scale(.5) translateY(6px);opacity:.2}100%{transform:none;opacity:1}}
.memo{flex:none;margin:0 0 4px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);color:var(--ink);font:inherit;font-size:15px;padding:8px 2px;text-align:center;border-radius:0}
.memo::placeholder{color:var(--ink3)}
.cats{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;display:grid;grid-template-columns:repeat(4,1fr);align-content:start;gap:12px 0;padding:14px 0 12px;transition:opacity .2s}
.cats::-webkit-scrollbar{display:none}
.entry.blank .cats{opacity:.5}
.cat{display:flex;flex-direction:column;align-items:center;gap:7px;padding:0 2px;min-width:0}
.cat .ic{width:56px;height:56px;transition:transform .16s cubic-bezier(.3,1.6,.5,1),border-color .16s}
.cat .ic svg{width:32px;height:32px}
.cat:active .ic{transform:scale(.9);border-color:var(--amber)}
.cat span{font-size:12.5px;font-weight:500;line-height:1.1;text-align:center;color:var(--ink2);overflow-wrap:anywhere;max-width:100%}
.keys{flex:none;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-bottom:6px}
.keys button{height:clamp(42px,6vh,52px);font-family:var(--display);font-weight:500;font-size:24px;color:var(--ink);display:grid;place-items:center;transition:background .12s,transform .14s cubic-bezier(.3,1.6,.5,1)}
.keys button:active{background:var(--bg2);transform:scale(.94)}
.keys svg{width:26px;height:26px;color:var(--ink2)}

/* signature */
.sig{position:absolute;inset:0;z-index:20;pointer-events:none;display:grid;place-items:center}
.sig .band{position:relative;width:100%;padding:30px 0 34px;text-align:center;
  background:linear-gradient(to bottom,rgba(var(--band),0),rgba(var(--band),.9) 24%,rgba(var(--band),.9) 76%,rgba(var(--band),0));
  animation:sigband 1.1s linear both;margin-top:-90px}
.sig .t,.sig .a{font-family:var(--display);font-weight:700;color:var(--exp);text-transform:uppercase;white-space:nowrap;animation:sigtext 1.1s cubic-bezier(.2,.6,.3,1) both}
.sig .t{font-size:30px;letter-spacing:.1em}
.sig .a{font-size:var(--asz,46px);margin-top:6px;animation-name:sigamt;color:var(--exp)}
.sig.inc .t,.sig.inc .a{color:var(--amber)}
.sig.heavy .band{padding:48px 0 52px;animation-duration:1.4s;
  background:linear-gradient(to bottom,rgba(var(--band),0),rgba(60,6,4,.94) 22%,rgba(30,3,2,.96) 78%,rgba(var(--band),0))}
.sig.heavy .t{font-size:38px;animation-duration:1.4s}
.sig.heavy .a{animation-duration:1.4s}
.sig.heavy.inc .band{background:linear-gradient(to bottom,rgba(var(--band),0),rgba(46,30,6,.94) 22%,rgba(24,14,2,.96) 78%,rgba(var(--band),0))}
@keyframes sigband{0%{opacity:0}14%{opacity:1}68%{opacity:1}100%{opacity:0}}
@keyframes sigtext{0%{opacity:0;letter-spacing:.06em}16%{opacity:1}62%{opacity:1}100%{opacity:0;letter-spacing:.36em}}
@keyframes sigamt{0%{opacity:0;letter-spacing:.02em}16%{opacity:1}62%{opacity:1}100%{opacity:0;letter-spacing:.14em}}
.sig .p{position:absolute;top:calc(50% - 130px);width:5px;height:5px;background:var(--amber);
  box-shadow:inset 1px 1px 0 #f3deaa,inset -1px -1px 0 #7a5614;opacity:0;animation:fall 1s cubic-bezier(.5,0,.9,.6) both}
.sig.exp .p.e{background:#c4552a;box-shadow:none}
@keyframes fall{0%{opacity:0;transform:translateY(0)}15%{opacity:1}100%{opacity:0;transform:translateY(240px)}}

.app-shake{animation:jolt .24s}
@keyframes jolt{0%,100%{transform:none}25%{transform:translate(-4px,3px)}60%{transform:translate(3px,-2px)}}

@media (prefers-reduced-motion: reduce){
  .entry,.entry.open{transition:opacity .01s,visibility 0s}
  .sig .band,.sig .t,.sig .a{animation:none;opacity:1}
  .sig .band{background:rgba(var(--band),.9)}
  .sig .p{display:none}
  .row.enter,.amount .val .pop,.cell.bal output.shake,.amount.nope,.app-shake{animation:none}
  .fab,.cat .ic,.keys button{transition:none}
}
</style>

    </div>

    <input class="memo" id="memo" type="text" placeholder="Add a note" maxlength="40" autocomplete="off" aria-label="Note">

    </div>
  </section>
</div>

var SVGC={};
function icon(name){
  if(SVGC[name])return SVGC[name];
  var d=ICONS[name]||ICONS.rune,rows=d.p.slice(),i,x,y,s,col,runs={};
  while(rows.length<16)rows.push("");
  for(y=0;y<16;y++){
    var r=(rows[y]+"................").slice(0,16);
    x=0;
    while(x<16){
      var ch=r[x];
      if(ch==="."){x++;continue}
      s=x;while(x<16&&r[x]===ch)x++;
      col=d.ui?"currentColor":(ch==="o"?PAL_O:ch==="h"?PAL_H:d.c[ch]);
      (runs[col]=runs[col]||[]).push("M"+s+" "+y+"h"+(x-s)+"v1h-"+(x-s)+"z");
    }
  }
  var out="<svg class=\"px\" viewBox=\"0 0 16 16\" shape-rendering=\"crispEdges\" aria-hidden=\"true\">";
  for(col in runs)out+="<path fill=\""+col+"\" d=\""+runs[col].join("")+"\"/>";
  return SVGC[name]=out+"</svg>";
}
var CAT_ICON={"Food":"food","Pizza":"pizza","Snacks":"apple","Fruits":"apple","Wine":"wine","Transportation":"bus","Utilities":"bolt","Subscriptions":"tv","Entertainment":"tv","Family":"family","Donations":"heart","Games":"pad","Arcade":"pad","Football":"pad","Salary":"coin","Refunds":"coin","ATM":"card","Bank fees":"card","Home":"home","Health":"health","Gift":"gift","Books":"books","Education":"books"};
var EXP_CATS=["Food","Pizza","Snacks","Fruits","Wine","Transportation","Utilities","Internet","Telephone","Subscriptions","Bank fees","Home","Electronics","Clothing","Health","Gift","Family","Donations","Games","Entertainment","ATM","Cigarettes","Filter","Books","Education","Football","Arcade","Others"];
var INC_CATS=["Salary","Refunds","Others"];
function catIcon(c){return icon(CAT_ICON[c]||"rune")}

/* ---------- data (fake) ---------- */
var now=new Date(),TY=now.getFullYear(),TM=now.getMonth(),TD=now.getDate();
function key(y,m,d){return y+"-"+(m<10?"0":"")+(m+1<10?"":"")+(m+1)+"-"+(d<10?"0":"")+d}
function dkey(y,m,d){var mm=m+1,dd=d;return y+"-"+(mm<10?"0"+mm:mm)+"-"+(dd<10?"0"+dd:dd)}
var id=0,tx=[];
function seed(off,type,cat,amt,memo){tx.push({id:++id,type:type,cat:cat,amt:amt,memo:memo||"",date:dkey(TY,TM,Math.max(1,TD-off))})}
seed(4,"inc","Salary",52000,"");
seed(4,"exp","ATM",3000,"");
seed(4,"exp","Health",780,"Pharmacy");
seed(3,"inc","Others",207733,"Sold old bike");

seed(2,"exp","Family",1500,"");
seed(2,"exp","Donations",500,"");

seed(1,"exp","Subscriptions",199,"Spotify");
seed(1,"exp","Games",449,"Indie game");

seed(0,"exp","Transportation",120,"Metro");

var view={y:TY,m:TM},lastAdded=0;
var MONTHS=["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];
var MON3=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
var DOW=["SUN","MON","TUE","WED","THU","FRI","SAT"];

function inView(t,y,m){return t.date.slice(0,7)===y+"-"+(m+1<10?"0"+(m+1):m+1)}
function totals(y,m,excl){
  var i=0,e=0;
  tx.forEach(function(t){if(t.id===excl||!inView(t,y,m))return;if(t.type==="inc")i+=t.amt;else e+=t.amt});
  return {i:i,e:e,b:i-e};
}

/* ---------- month card ---------- */
var oi=$("#oi"),oe=$("#oe"),ob=$("#ob"),shown={i:0,e:0,b:0},tweenId=0;
function paint(v){
  oi.textContent=fmt(v.i);oe.textContent=v.e?"-"+fmt(v.e):"0";
  ob.textContent=(v.b<0?"-":"")+fmt(v.b);
  [oi,oe,ob].forEach(function(o){o.classList.toggle("s",o.textContent.length>8)});
  ob.classList.toggle("neg",v.b<0);
}
function setShown(v){shown={i:v.i,e:v.e,b:v.b};paint(shown)}
function tweenTo(v,after){
  var from=shown,t0=performance.now(),D=520,myId=++tweenId;
  if(reduce()){setShown(v);after&&after();return}
  (function step(t){
    if(myId!==tweenId)return;
    var p=Math.min(1,(t-t0)/D),k=1-Math.pow(1-p,3);
    paint({i:Math.round(from.i+(v.i-from.i)*k),e:Math.round(from.e+(v.e-from.e)*k),b:Math.round(from.b+(v.b-from.b)*k)});
    if(p<1)requestAnimationFrame(step);else{shown=v;after&&after()}
  })(t0);
}
function shakeBalance(){ob.classList.remove("shake");void ob.offsetWidth;ob.classList.add("shake")}

/* ---------- list ---------- */
var listEl=$("#list");
function renderHead(){$("#mn").textContent=MONTHS[view.m];$("#yr").textContent=String(view.y)}
function renderList(){
  var items=tx.filter(function(t){return inView(t,view.y,view.m)}).sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:b.id-a.id});
  if(!items.length){listEl.innerHTML="<div class=\"empty\">THE LEDGER IS QUIET<br>NOTHING RECORDED</div>";return}
  var html="",cur="",todayKey=dkey(TY,TM,TD),n=0;
  items.forEach(function(t){
    if(t.date!==cur){
      cur=t.date;
      var d=new Date(+t.date.slice(0,4),+t.date.slice(5,7)-1,+t.date.slice(8,10));
      var net=0;items.forEach(function(u){if(u.date===cur)net+=u.type==="inc"?u.amt:-u.amt});
      html+="<div class=\"day\"><span>"+DOW[d.getDay()]+" "+d.getDate()+" "+MON3[d.getMonth()]+(cur===todayKey?" · <em>TODAY</em>":"")+"</span><i>"+(net<0?"-":"")+fmt(net)+"</i></div>";
    }
    html+="<div class=\"row "+t.type+(t.id===lastAdded?" enter":"")+"\"><span class=\"ic\">"+catIcon(t.cat)+"</span><span class=\"nm\"><b>"+esc(t.cat)+"</b>"+(t.memo?"<small>"+esc(t.memo)+"</small>":"")+"</span><span class=\"am\">"+(t.type==="exp"?"-":"")+fmt(t.amt)+"</span></div>";
  });
  listEl.innerHTML=html;
}
function renderAll(){renderHead();renderList();setShown(totals(view.y,view.m))}

function go(dir){
  view.m+=dir;if(view.m<0){view.m=11;view.y--}else if(view.m>11){view.m=0;view.y++}
  lastAdded=0;renderAll();listEl.scrollTop=0;
  if(!reduce())listEl.animate([{transform:"translateX("+(dir*34)+"px)",opacity:0},{transform:"none",opacity:1}],{duration:240,easing:"cubic-bezier(.2,.8,.2,1)"});
}
$("#prev").addEventListener("click",function(){go(-1)});
$("#next").addEventListener("click",function(){go(1)});
(function(){
  var sx=0,sy=0;
  listEl.addEventListener("touchstart",function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
  listEl.addEventListener("touchend",function(e){
    var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*2)go(dx<0?1:-1);
  },{passive:true});
})();

/* ---------- theme + sound ---------- */
var root=document.documentElement,snd=false,ac=null,sndBtn=$("#snd"),thBtn=$("#theme");
function isLight(){
  var t=root.getAttribute("data-theme");
  if(t)return t==="light";
  return !!(window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches);
}
function paintBtns(){
  sndBtn.innerHTML=icon(snd?"spk":"spkoff");
  sndBtn.setAttribute("aria-pressed",snd?"true":"false");sndBtn.setAttribute("aria-label",snd?"Sound on":"Sound off");
  thBtn.innerHTML=icon(isLight()?"moon":"sun");
}
thBtn.addEventListener("click",function(){root.setAttribute("data-theme",isLight()?"dark":"light");paintBtns()});
sndBtn.addEventListener("click",function(){
  snd=!snd;
  try{if(snd){ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();blip(988,.0,.07,"square",.04)}}catch(e){snd=false}
  paintBtns();
});
function blip(f,at,dur,type,vol){
  if(!ac)return;var t=ac.currentTime+at,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur+.02);
}
function sound(type,heavy){
  if(!snd||!ac)return;
  try{
    if(type==="exp"){
      var t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain(),f=ac.createBiquadFilter();
      o.type="sawtooth";o.frequency.setValueAtTime(heavy?52:66,t);o.frequency.exponentialRampToValueAtTime(38,t+.9);
      f.type="lowpass";f.frequency.value=260;
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(heavy?.22:.14,t+.06);g.gain.exponentialRampToValueAtTime(.0001,t+.95);
      o.connect(f);f.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+1);
      blip(988,.04,.07,"square",.03);blip(1319,.1,.16,"square",.03);
    }else{
      blip(784,0,.08,"square",.035);blip(988,.08,.08,"square",.035);blip(1319,.16,.22,"square",.035);
    }
  }catch(e){}
}

/* ---------- signature moment ---------- */
var sigEl=null,sigTimer=0;
function killSig(){if(sigEl){sigEl.remove();sigEl=null}clearTimeout(sigTimer)}
document.addEventListener("pointerdown",function(){if(sigEl)killSig()},true);
function signature(type,amt){
  killSig();
  var heavy=amt>=5000,txt=fmt(amt),len=txt.length,asz=len>9?30:len>7?36:len>5?42:48;
  if(heavy)asz=Math.round(asz*1.08);
  var el=document.createElement("div");
  el.className="sig "+type+(heavy?" heavy":"");
  el.setAttribute("aria-hidden","true");
  el.style.setProperty("--asz",asz+"px");
  var h="<div class=\"band\"><div class=\"t\">"+(type==="inc"?"YOU EARNED":"YOU SPENT")+"</div><div class=\"a\">₴"+txt+"</div></div>";
  if(!reduce()){
    var n=heavy?22:14,i;
    for(i=0;i<n;i++){
      var left=8+Math.random()*84,delay=(Math.random()*.55).toFixed(2),dur=(.75+Math.random()*.4).toFixed(2),sz=Math.random()<.4?7:5;
      h+="<i class=\"p"+(type==="exp"&&i%3===0?" e":"")+"\" style=\"left:"+left.toFixed(1)+"%;animation-delay:"+delay+"s;animation-duration:"+dur+"s;width:"+sz+"px;height:"+sz+"px\"></i>";
    }
  }
  el.innerHTML=h;
  $("#frame").appendChild(el);sigEl=el;
  if(heavy&&!reduce()){var f=$("#frame");f.classList.remove("app-shake");void f.offsetWidth;f.classList.add("app-shake")}
  sound(type,heavy);
  sigTimer=setTimeout(killSig,reduce()?600:(heavy?1400:1100));
}

/* ---------- entry ---------- */
var entry=$("#entry"),valEl=$("#val"),amtBox=$("#amount"),memo=$("#memo"),catsEl=$("#cats"),dateBtn=$("#date");
var E={type:"exp",digits:"",off:0};
var MAXD=9;
function dateOf(off){var d=new Date(TY,TM,TD+off);return d}
function dateLabel(){
  if(E.off===0)return "Today";if(E.off===-1)return "Yesterday";
  var d=dateOf(E.off);return d.getDate()+" "+MON3[d.getMonth()].charAt(0)+MON3[d.getMonth()].slice(1).toLowerCase();
}
function renderAmount(pop){
  var d=E.digits;
  if(!d){valEl.textContent="0";valEl.classList.add("zero")}
  else{
    valEl.classList.remove("zero");
    var s=fmt(+d);
    valEl.innerHTML=pop&&!reduce()?esc(s.slice(0,-1))+"<span class=\"pop\">"+esc(s.slice(-1))+"</span>":esc(s);
  }
  var L=(d?fmt(+d):"0").length;
  valEl.style.fontSize=(L>10?34:L>8?40:L>6?46:52)+"px";
  entry.classList.toggle("blank",!d);
}
function recents(type){
  var names=type==="inc"?INC_CATS:EXP_CATS,seen={},out=[];
  tx.slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:b.id-a.id}).forEach(function(t){
    if(t.type===type&&!seen[t.cat]){seen[t.cat]=1;out.push(t.cat)}
  });
  names.forEach(function(n){if(!seen[n])out.push(n)});
  return out;
}
function renderCats(){
  catsEl.innerHTML=recents(E.type).map(function(c){
    return "<button class=\"cat\" type=\"button\" data-c=\""+esc(c)+"\"><span class=\"ic\">"+catIcon(c)+"</span><span>"+esc(c)+"</span></button>";
  }).join("");
  catsEl.scrollTop=0;
}
function setType(t){
  E.type=t;entry.setAttribute("data-type",t);
  entry.querySelectorAll(".seg button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.t===t?"true":"false")});
  renderCats();
}
function openEntry(){
  var fr=$("#frame").getBoundingClientRect(),fb=$("#fab").getBoundingClientRect();
  entry.style.setProperty("--fx",(fb.left+fb.width/2-fr.left)+"px");
  entry.style.setProperty("--fy",(fb.top+fb.height/2-fr.top)+"px");
  E={type:"exp",digits:"",off:0};memo.value="";dateBtn.textContent="Today";
  setType("exp");renderAmount(false);
  entry.classList.add("open");entry.setAttribute("aria-hidden","false");
}
function closeEntry(){entry.classList.remove("open");entry.setAttribute("aria-hidden","true");if(document.activeElement&&entry.contains(document.activeElement))document.activeElement.blur()}
$("#fab").addEventListener("click",openEntry);
$("#close").addEventListener("click",closeEntry);
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"&&entry.classList.contains("open"))closeEntry();
  if(entry.classList.contains("open")&&document.activeElement!==memo){
    if(/^[0-9]$/.test(e.key))press(e.key);else if(e.key==="Backspace")press("del");
  }
});
entry.querySelectorAll(".seg button").forEach(function(b){b.addEventListener("click",function(){setType(b.dataset.t)})});
dateBtn.addEventListener("click",function(){E.off=E.off<=-6?0:E.off-1;dateBtn.textContent=dateLabel()});
function press(k){
  if(k==="del"){E.digits=E.digits.slice(0,-1);renderAmount(false);return}
  if(!E.digits&&/^0+$/.test(k))return;
  if((E.digits+k).length>MAXD)return;
  E.digits+=k;renderAmount(true);
}
$("#keys").addEventListener("click",function(e){var b=e.target.closest("button");if(b)press(b.dataset.k)});
catsEl.addEventListener("click",function(e){
  var b=e.target.closest(".cat");if(!b)return;
  if(!E.digits){amtBox.classList.remove("nope");void amtBox.offsetWidth;amtBox.classList.add("nope");return}
  save(b.dataset.c);
});

function save(cat){
  var amt=parseInt(E.digits,10),d=dateOf(E.off),type=E.type;
  var t={id:++id,type:type,cat:cat,amt:amt,memo:memo.value.trim(),date:dkey(d.getFullYear(),d.getMonth(),d.getDate())};
  tx.push(t);lastAdded=t.id;
  var changed=(view.y!==d.getFullYear()||view.m!==d.getMonth());
  view.y=d.getFullYear();view.m=d.getMonth();
  renderHead();renderList();
  var before=totals(view.y,view.m,t.id),after=totals(view.y,view.m);
  setShown(before);
  closeEntry();
  signature(type,amt);
  setTimeout(function(){
    tweenTo(after,function(){if(after.b<0)shakeBalance()});
    var row=listEl.querySelector(".row.enter");if(row&&row.scrollIntoView&&changed)row.scrollIntoView({block:"nearest"});
  },reduce()?300:560);
}

paintBtns();renderAll();
})();
